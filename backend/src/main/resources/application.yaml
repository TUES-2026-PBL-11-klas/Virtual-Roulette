spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres                     #${DB_URL}
    username: postgres                #${DB_USERNAME}
    password: 1234                #${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

