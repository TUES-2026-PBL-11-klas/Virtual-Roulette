apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: roulette
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: alex270817/virtual-roulette-frontend:v1
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_API_URL
              value: http://backend.roulette.svc.cluster.local
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config