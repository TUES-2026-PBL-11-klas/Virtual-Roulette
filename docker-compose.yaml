services:
  # Data base
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: pesho
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: roulette_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Java Spring
  backend:
    build: ./backend
    container_name: java_backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/roulette_db
      SPRING_DATASOURCE_USERNAME: pesho
      SPRING_DATASOURCE_PASSWORD: 123

  # 3. React Frontend
  frontend:
    build: ./frontend/virrule
    container_name: react_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
